name = "larkspur-care-demo"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./public"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

# The customer's password (DEMO_PASSWORD, default in src/worker.js) and the staff console key (STAFF_KEY) are
# Worker secrets: wrangler secret put STAFF_KEY
